name: Release

# Push a tag shaped like v1.0.0 to cut a release. The tag version must match
# <Version> in SitePix/SitePix.csproj — the build will fail otherwise.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Must match csproj <Version>.'
        required: true
        type: string

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------------------
  # Resolve the version once and share it across jobs.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_date: ${{ steps.resolve.outputs.release_date }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve version"; exit 1
          fi

          CSPROJ_VERSION=$(grep -oE '<Version>[^<]+</Version>' SitePix/SitePix.csproj | head -n1 | sed -E 's|<\/?Version>||g')
          if [[ "$VERSION" != "$CSPROJ_VERSION" ]]; then
            echo "Version mismatch: tag/input is '$VERSION' but csproj <Version> is '$CSPROJ_VERSION'. Bump the csproj before tagging." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

  # ---------------------------------------------------------------------------
  # Create the draft GitHub Release up front. Every platform job below
  # uploads its packaged outputs directly to the release with `gh release
  # upload`, so we never use actions/upload-artifact for build outputs —
  # release assets are unmetered, while Actions artifact storage caps at
  # 500 MB on the Free plan and our payload is ~840 MB per run.
  # ---------------------------------------------------------------------------
  prepare-release:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Render release notes
        run: |
          cat > release-notes.md <<EOF
          ## SitePix $VERSION

          ### Windows
          - \`SitePix-Setup-$VERSION.exe\` — installer (recommended)
          - \`SitePix-$VERSION-win-x64-portable.zip\` — portable
          - \`winget install AlexReich.SitePix\`
          - \`choco install sitepix\`

          ### macOS
          - \`SitePix-$VERSION-osx-arm64.tar.gz\` (Apple Silicon)
          - \`SitePix-$VERSION-osx-x64.tar.gz\` (Intel)
          - \`brew install alexreich/tap/sitepix\`
          - Or one-liner: \`curl -fsSL https://github.com/alexreich/SitePix/releases/latest/download/install.sh | sh\`

          ### Linux
          - \`SitePix-$VERSION-x86_64.AppImage\` (universal, single file)
          - \`sitepix_${VERSION}_amd64.deb\` / \`_arm64.deb\` (Debian, Ubuntu, Mint)
          - \`sitepix-$VERSION-1.x86_64.rpm\` / \`.aarch64.rpm\` (Fedora, RHEL, openSUSE)
          - \`SitePix-$VERSION-linux-x64.tar.gz\` / \`-linux-arm64.tar.gz\` (portable tarballs)
          - Or one-liner: \`curl -fsSL https://github.com/alexreich/SitePix/releases/latest/download/install.sh | sh\`

          ### Profiles
          The bundled profile is kadampa.org. Six sample profiles ship in
          \`samples/\` — file basename is the source domain:
          \`petapixel.com\`, \`atlasobscura.com\`, \`fstoppers.com\`,
          \`thephoblographer.com\`, \`smashingmagazine.com\`, \`kadampa.org\`.
          Point SitePix at any of them on the command line:
              sitepix samples/petapixel.com.json
          See README.md for the schema.

          ### Scheduling
          On first run SitePix registers a daily task using whatever scheduler the
          host OS provides (Task Scheduler / launchd / cron). Run
          \`sitepix-install-schedule\` to swap a Linux cron entry for a systemd user
          timer, change the time, or remove the schedule entirely.
          EOF

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          # Only flip draft on creation; never demote an already-published
          # release back to draft on re-runs (would hide the live download).
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            gh release edit "$TAG" --title "SitePix $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "SitePix $VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload install.sh (curl-pipe installer for mac/linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VERSION" install.sh --clobber

  # ---------------------------------------------------------------------------
  # WINDOWS: self-contained exe → Inno installer → portable zip → winget + choco
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [version, prepare-release]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_DATE: ${{ needs.version.outputs.release_date }}
      PUBLISH_DIR: SitePix\bin\Release\net10.0\win-x64\publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64, self-contained, single-file)
        run: dotnet publish SitePix/SitePix.csproj -c Release -r win-x64 -p:PublishSingleFile=true -o ${{ env.PUBLISH_DIR }}

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "artifacts\SitePix-$env:VERSION-win-x64-portable.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # windows-latest runner ships Inno Setup 6 preinstalled at the path below.
          # Only invoke choco if it's actually missing — pinning --version=6.2.2 fails
          # on runners that already have a newer Inno (choco refuses to downgrade).
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Inno Setup already present at $iscc"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $publishAbs = Resolve-Path $env:PUBLISH_DIR
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:VERSION" "/DPublishDir=$publishAbs" "packaging\inno\SitePix.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          Copy-Item "packaging\inno\Output\SitePix-Setup-$env:VERSION.exe" "artifacts\"

      - name: Compute installer SHA-256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "artifacts\SitePix-Setup-$env:VERSION.exe" -Algorithm SHA256).Hash.ToUpperInvariant()
          "sha256=$hash" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Generate winget manifests
        shell: pwsh
        run: |
          $outDir = "artifacts\winget\manifests\a\AlexReich\SitePix\$env:VERSION"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Get-ChildItem 'packaging\winget\*.yaml' | ForEach-Object {
            $content = (Get-Content $_.FullName -Raw).
              Replace('__VERSION__', $env:VERSION).
              Replace('__SHA256__', '${{ steps.sha.outputs.sha256 }}').
              Replace('__RELEASE_DATE__', $env:RELEASE_DATE)
            Set-Content -Path (Join-Path $outDir $_.Name) -Value $content -NoNewline
          }
          Compress-Archive -Path "artifacts\winget\*" -DestinationPath "artifacts\SitePix-$env:VERSION-winget-manifests.zip" -CompressionLevel Optimal

      - name: Build Chocolatey nupkg
        id: choco
        shell: pwsh
        run: |
          $stage = "artifacts\choco-stage"
          New-Item -ItemType Directory -Force -Path "$stage\tools" | Out-Null
          $rootLen = (Resolve-Path 'packaging\chocolatey').Path.Length + 1
          Get-ChildItem 'packaging\chocolatey' -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($rootLen)
            $dest = Join-Path $stage $rel
            $destDir = Split-Path -Parent $dest
            if ($destDir) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
            if ($_.Extension -in '.ps1','.nuspec','.txt') {
              $content = (Get-Content $_.FullName -Raw).
                Replace('__VERSION__', $env:VERSION).
                Replace('__SHA256__', '${{ steps.sha.outputs.sha256 }}')
              Set-Content -Path $dest -Value $content -NoNewline
            } else {
              Copy-Item $_.FullName $dest
            }
          }
          Push-Location $stage
          choco pack sitepix.nuspec --out ..
          Pop-Location

      - name: SHA-256 sidecars + upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd artifacts
          FILES=(
            "SitePix-Setup-$VERSION.exe"
            "SitePix-$VERSION-win-x64-portable.zip"
            "sitepix.$VERSION.nupkg"
            "SitePix-$VERSION-winget-manifests.zip"
          )
          UPLOAD=()
          for f in "${FILES[@]}"; do
            sha256sum "$f" > "$f.sha256"
            UPLOAD+=("$f" "$f.sha256")
          done
          # Direct upload to the (draft) release. Skips Actions artifact
          # storage entirely — release assets are unmetered.
          gh release upload "v$VERSION" "${UPLOAD[@]}" --clobber

  # ---------------------------------------------------------------------------
  # LINUX: tarballs + AppImage + .deb + .rpm
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [version, prepare-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm imagemagick desktop-file-utils
          sudo gem install --no-document fpm
          # AppImage runtime + appimagetool — FUSE is not available in GHA,
          # so extract the AppImage to use it without mounting.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          /tmp/appimagetool.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Generate placeholder icon
        run: |
          mkdir -p artifacts/icons
          convert -size 256x256 xc:'#224486' -gravity center \
            -font DejaVu-Sans-Bold -pointsize 96 -fill white -annotate 0 "S" \
            artifacts/icons/sitepix.png

      - name: Publish linux-x64 + linux-arm64
        run: |
          dotnet publish SitePix/SitePix.csproj -c Release -r linux-x64   --self-contained -p:PublishSingleFile=true -o publish/linux-x64
          dotnet publish SitePix/SitePix.csproj -c Release -r linux-arm64 --self-contained -p:PublishSingleFile=true -o publish/linux-arm64

      - name: Tarballs
        run: |
          mkdir -p artifacts
          for arch in linux-x64 linux-arm64; do
            tar -C publish/$arch -czf artifacts/SitePix-$VERSION-$arch.tar.gz .
          done

      - name: Build AppImage (x64)
        run: |
          APPDIR=build/SitePix.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r publish/linux-x64/. "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/SitePix"
          cp artifacts/icons/sitepix.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/sitepix.png"
          cp artifacts/icons/sitepix.png "$APPDIR/sitepix.png"
          cat > "$APPDIR/sitepix.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=SitePix
          Comment=Pulls photos from configured news site
          Exec=SitePix
          Icon=sitepix
          Terminal=true
          Categories=Utility;
          EOF
          cp "$APPDIR/sitepix.desktop" "$APPDIR/usr/share/applications/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/usr/bin"
          exec ./SitePix "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          ARCH=x86_64 appimagetool "$APPDIR" "artifacts/SitePix-$VERSION-x86_64.AppImage"

      - name: Build .deb / .rpm (x64 and arm64)
        run: |
          for arch in linux-x64 linux-arm64; do
            [[ "$arch" == "linux-x64" ]]   && DEB_ARCH=amd64 && RPM_ARCH=x86_64
            [[ "$arch" == "linux-arm64" ]] && DEB_ARCH=arm64 && RPM_ARCH=aarch64

            ROOT=build/pkg-$arch
            rm -rf "$ROOT"
            mkdir -p "$ROOT/opt/sitepix" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/256x256/apps" "$ROOT/usr/share/doc/sitepix"
            cp -r publish/$arch/. "$ROOT/opt/sitepix/"
            chmod +x "$ROOT/opt/sitepix/SitePix"
            ln -sf /opt/sitepix/SitePix "$ROOT/usr/bin/sitepix"
            cp artifacts/icons/sitepix.png "$ROOT/usr/share/icons/hicolor/256x256/apps/"
            cp packaging/linux/sitepix-install-schedule "$ROOT/usr/bin/sitepix-install-schedule"
            chmod +x "$ROOT/usr/bin/sitepix-install-schedule"
            cat > "$ROOT/usr/share/applications/sitepix.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=SitePix
          Comment=Pulls photos from configured news site
          Exec=sitepix
          Icon=sitepix
          Terminal=true
          Categories=Utility;
          EOF
            cp README.md LICENSE "$ROOT/usr/share/doc/sitepix/" 2>/dev/null || true

            fpm -s dir -t deb -a $DEB_ARCH -n sitepix -v $VERSION \
              --description "Pulls photos from WordPress-style news blogs (kadampa.org by default; profile-driven)." \
              --url https://github.com/alexreich/SitePix \
              --maintainer "Alex Reich" \
              --license "CC-BY-4.0" \
              --after-install packaging/linux/postinst.sh \
              --before-remove packaging/linux/prerm.sh \
              -C "$ROOT" -p "artifacts/sitepix_${VERSION}_${DEB_ARCH}.deb" .

            fpm -s dir -t rpm -a $RPM_ARCH -n sitepix -v $VERSION \
              --description "Pulls photos from WordPress-style news blogs (kadampa.org by default; profile-driven)." \
              --url https://github.com/alexreich/SitePix \
              --maintainer "Alex Reich" \
              --license "CC-BY-4.0" \
              --after-install packaging/linux/postinst.sh \
              --before-remove packaging/linux/prerm.sh \
              -C "$ROOT" -p "artifacts/sitepix-${VERSION}-1.${RPM_ARCH}.rpm" .
          done

      - name: SHA-256 sidecars + upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          FILES=(
            "SitePix-$VERSION-linux-x64.tar.gz"
            "SitePix-$VERSION-linux-arm64.tar.gz"
            "SitePix-$VERSION-x86_64.AppImage"
            "sitepix_${VERSION}_amd64.deb"
            "sitepix_${VERSION}_arm64.deb"
            "sitepix-$VERSION-1.x86_64.rpm"
            "sitepix-$VERSION-1.aarch64.rpm"
          )
          UPLOAD=()
          for f in "${FILES[@]}"; do
            sha256sum "$f" > "$f.sha256"
            UPLOAD+=("$f" "$f.sha256")
          done
          # Direct upload to the (draft) release. ~520 MB of Linux packages
          # bypasses Actions artifact storage entirely.
          gh release upload "v$VERSION" "${UPLOAD[@]}" --clobber

  # ---------------------------------------------------------------------------
  # macOS: self-contained tarballs (x64 + arm64) + Homebrew formula hashes
  # ---------------------------------------------------------------------------
  build-macos:
    needs: [version, prepare-release]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish osx-x64 + osx-arm64
        run: |
          dotnet publish SitePix/SitePix.csproj -c Release -r osx-x64   --self-contained -p:PublishSingleFile=true -o publish/osx-x64
          dotnet publish SitePix/SitePix.csproj -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o publish/osx-arm64

      - name: Tarballs + hashes
        id: hashes
        run: |
          mkdir -p artifacts
          cd publish/osx-x64   && tar -czf "../../artifacts/SitePix-$VERSION-osx-x64.tar.gz"   . && cd -
          cd publish/osx-arm64 && tar -czf "../../artifacts/SitePix-$VERSION-osx-arm64.tar.gz" . && cd -
          SHA_X64=$(shasum -a 256 "artifacts/SitePix-$VERSION-osx-x64.tar.gz"   | awk '{print $1}')
          SHA_ARM=$(shasum -a 256 "artifacts/SitePix-$VERSION-osx-arm64.tar.gz" | awk '{print $1}')
          echo "sha_x64=$SHA_X64" >> "$GITHUB_OUTPUT"
          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "x64:   $SHA_X64"
          echo "arm64: $SHA_ARM"

      - name: Render Homebrew formula
        run: |
          sed \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__SHA_X64__|${{ steps.hashes.outputs.sha_x64 }}|g" \
            -e "s|__SHA_ARM__|${{ steps.hashes.outputs.sha_arm }}|g" \
            packaging/homebrew/sitepix.rb.template \
            > artifacts/sitepix.rb

      - name: SHA-256 sidecars + upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          FILES=(
            "SitePix-$VERSION-osx-x64.tar.gz"
            "SitePix-$VERSION-osx-arm64.tar.gz"
          )
          UPLOAD=("sitepix.rb")
          for f in "${FILES[@]}"; do
            shasum -a 256 "$f" > "$f.sha256"
            UPLOAD+=("$f" "$f.sha256")
          done
          # Tarballs + Homebrew formula go to the release; the finalize job
          # pulls the .rb back from the release for tap push.
          gh release upload "v$VERSION" "${UPLOAD[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Release: gather everything, create the GH Release, optionally push to
  # Chocolatey / winget / Homebrew tap.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each platform job already pushed its assets to the draft release.
          # Flip the draft bit and mark this as the latest release.
          gh release edit "v$VERSION" --draft=false --latest

      - name: Push to Chocolatey community feed
        if: env.CHOCO_API_KEY != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$VERSION" -p '*.nupkg' -D /tmp/choco
          NUPKG=$(ls /tmp/choco/*.nupkg | head -n1)
          if [[ -z "$NUPKG" ]]; then echo "No .nupkg in release"; exit 1; fi
          dotnet nuget push "$NUPKG" --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"

      - name: Submit winget PR
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALLER_URL="https://github.com/alexreich/SitePix/releases/download/v$VERSION/SitePix-Setup-$VERSION.exe"
          # Resolve the actual Linux x86_64 Komac asset URL via the GitHub API —
          # their release-asset names drift over time (zip vs tar.gz, nightly vs stable).
          ASSET_URL=$(gh api repos/russellbanks/Komac/releases/latest \
            --jq '.assets[] | select(.name | test("(?i)linux.*x86_64|x86_64.*linux")) | select(.name | test("(zip|tar\\.gz)$")) | .browser_download_url' \
            | head -n1)
          if [[ -z "$ASSET_URL" ]]; then
            echo "::warning::Could not locate a Komac linux asset — submit winget manifests manually from the release zip."; exit 0
          fi
          echo "Komac asset: $ASSET_URL"
          curl -fsSL "$ASSET_URL" -o /tmp/komac.archive
          mkdir -p /tmp/komac
          case "$ASSET_URL" in
            *.zip) unzip -q /tmp/komac.archive -d /tmp/komac ;;
            *)     tar -xzf /tmp/komac.archive -C /tmp/komac ;;
          esac
          KOMAC_BIN=$(find /tmp/komac -type f -name 'komac' -perm -u+x 2>/dev/null | head -n1)
          [[ -z "$KOMAC_BIN" ]] && KOMAC_BIN=$(find /tmp/komac -type f -name 'komac' | head -n1)
          if [[ -z "$KOMAC_BIN" ]]; then
            echo "::warning::komac binary not found in archive — submit manifests manually."; exit 0
          fi
          chmod +x "$KOMAC_BIN"
          # `komac update` requires the package to already exist in
          # microsoft/winget-pkgs. For the first-ever submission of a
          # package, fall back to `komac new`. Subsequent versions will
          # land on `update` with no fallback needed.
          if ! "$KOMAC_BIN" update AlexReich.SitePix --version "$VERSION" --urls "$INSTALLER_URL" --submit --token "$WINGET_TOKEN"; then
            echo "::notice::komac update failed (likely first-ever submission); falling back to komac new"
            "$KOMAC_BIN" new AlexReich.SitePix --version "$VERSION" --urls "$INSTALLER_URL" --submit --token "$WINGET_TOKEN"
          fi

      - name: Push Homebrew formula to tap
        if: env.HOMEBREW_TAP_TOKEN != '' && env.HOMEBREW_TAP_REPO != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$VERSION" -p 'sitepix.rb' -D /tmp/brew
          FORMULA=/tmp/brew/sitepix.rb
          if [[ ! -f "$FORMULA" ]]; then echo "No formula in release"; exit 1; fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp "$FORMULA" tap/Formula/sitepix.rb
          cd tap
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/sitepix.rb
          if git diff --cached --quiet; then
            echo "No changes to formula; skipping push"
          else
            git commit -m "sitepix $VERSION"
            git push
          fi
