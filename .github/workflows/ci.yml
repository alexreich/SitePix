name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SitePix.sln

      - name: Build
        run: dotnet build SitePix.sln -c Release --no-restore

      - name: Publish (smoke — verify self-contained single-file succeeds)
        run: dotnet publish SitePix/SitePix.csproj -c Release -r win-x64 -p:PublishSingleFile=true --no-restore -o artifacts/publish
